<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Management System</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Employee Management System</h1>

  <div class="form">
    <input type="text" id="empName" placeholder="Enter employee name" />
    <input type="text" id="empRole" placeholder="Enter job title" />
    <input type="email" id="empEmail" placeholder="Enter contact email" />

    <button onclick="addOrUpdateEmployee()" id="submitBtn">Add Employee</button>
  </div>

  <div class="employee-table">
    <table>
      <thead>
        <tr>
            <th>Employee Name</th>
            <th>Job Title</th>
            <th>Contact Email</th>
            <th>Options</th>
            
        </tr>
      </thead>
      <tbody id="employeeList"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
